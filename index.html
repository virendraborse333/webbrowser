<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAI - Customer Support</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         RAI MAIN PAGE
    ========================== -->

    <main class="rai-page">

        <div class="rai-container">

            <!-- RAI Robot -->
            <div class="rai-logo">

                <div class="spark spark-1">✦</div>
                <div class="spark spark-2">✦</div>
                <div class="spark spark-3">✦</div>

                <div class="robot-circle">

                    <div class="robot">

                        <div class="robot-ear left"></div>
                        <div class="robot-ear right"></div>

                        <div class="robot-face">

                            <div class="eye left-eye"></div>
                            <div class="eye right-eye"></div>

                            <div class="robot-smile"></div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Heading -->
            <h1>
                How can <span>RAI</span> help?
            </h1>


            <!-- Search / Ask RAI -->
            <div class="ask-box">

                <div class="ask-icon">
                    ✦
                </div>

                <input
                    type="text"
                    id="raiInput"
                    placeholder="Ask RAI..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    class="send-button"
                    aria-label="Send"
                >
                    ➤
                </button>

            </div>


            <!-- Quick Reply Buttons -->
            <div class="quick-actions">

                <button
                    class="quick-button"
                    data-message="I need help with billing and payments."
                >

                    <div class="quick-icon">
                        $
                    </div>

                    <span>
                        Billing & Payments
                    </span>

                </button>


                <button
                    class="quick-button"
                    data-message="I need help with a maintenance request."
                >

                    <div class="quick-icon wrench">
                        🔧
                    </div>

                    <span>
                        Maintenance Requests
                    </span>

                </button>


                <button
                    class="quick-button"
                    data-message="I would like to check my project status."
                >

                    <div class="quick-icon">
                        ✓
                    </div>

                    <span>
                        Project Status
                    </span>

                </button>


                <button
                    class="quick-button"
                    data-message="I need help with cancelling or changing my project."
                >

                    <div class="quick-icon">
                        ×
                    </div>

                    <span>
                        Cancellations & Changes
                    </span>

                </button>

            </div>


            <!-- Loading / Status -->
            <div id="raiStatus" class="rai-status">
                Connecting to RAI...
            </div>

        </div>

    </main>


    <!-- Salesforce Embedded Messaging -->

    <script type="text/javascript">

        /*
         * Salesforce Embedded Messaging
         */

        function initEmbeddedMessaging() {

            console.log(
                "[RAI] Initializing Embedded Messaging..."
            );

            try {

                embeddedservice_bootstrap.settings.language = 'en_US';

                /*
                 * Hide Salesforce default floating button.
                 *
                 * We use our own RAI UI instead.
                 */
                embeddedservice_bootstrap.settings.hideChatButton = true;


                embeddedservice_bootstrap.init(

                    '00Dak00001CA8mT',

                    'RAI_Messaging_Service',

                    'https://orgfarm-bab6d235b5-dev-ed.develop.my.site.com/ESWRAIMessagingService1788353264936',

                    {
                        scrt2URL:
                            'https://orgfarm-bab6d235b5-dev-ed.develop.my.salesforce-scrt.com'
                    }

                );

            }

            catch (err) {

                console.error(
                    '[RAI] Error loading Embedded Messaging:',
                    err
                );

                updateRAIStatus(
                    "Unable to connect to RAI."
                );

            }

        }


        /*
         * Salesforce Messaging Ready
         */

        window.addEventListener(
            "onEmbeddedMessagingReady",
            function () {

                console.log(
                    "[RAI] Embedded Messaging is ready."
                );

                updateRAIStatus(
                    "RAI is ready to help."
                );

            }
        );


        /*
         * Load Salesforce Bootstrap
         */

        (function () {

            const script =
                document.createElement('script');

            script.src =
                'https://orgfarm-bab6d235b5-dev-ed.develop.my.site.com/ESWRAIMessagingService1788353264936/assets/js/bootstrap.min.js';

            script.async = true;


            script.onload = function () {

                console.log(
                    "[RAI] Salesforce bootstrap loaded."
                );

                initEmbeddedMessaging();

            };


            script.onerror = function () {

                console.error(
                    "[RAI] Salesforce bootstrap failed."
                );

                updateRAIStatus(
                    "Unable to connect to RAI."
                );

            };


            document.head.appendChild(script);

        })();

    </script>


    <!-- Your RAI JavaScript -->
    <script src="script.js"></script>

</body>
</html>
