<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAI - Customer Support</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER IMAGE
    ========================== -->

    <header class="site-header">

        <img
            src="header.png"
            alt="LGCY Header"
            class="header-image"
        >

    </header>


    <!-- =========================
         LANGUAGE TOGGLE  (NEW)
    ========================== -->

    <div class="lang-toggle" role="group" aria-label="Language / Idioma">

        <button
            type="button"
            id="lang-en"
            class="lang-btn"
            aria-pressed="true"
        >
            EN
        </button>

        <button
            type="button"
            id="lang-es"
            class="lang-btn"
            aria-pressed="false"
        >
            ES
        </button>

    </div>


    <!-- =========================
         RAI MAIN PAGE
    ========================== -->

    <main class="rai-page">

        <div class="rai-container">

            <!-- RAI Robot -->
            <div class="rai-logo">

                <div class="spark spark-1">✦</div>
                <div class="spark spark-2">✦</div>
                <div class="spark spark-3">✦</div>

                <div class="robot-circle">

                    <div class="robot">

                        <div class="robot-ear left"></div>
                        <div class="robot-ear right"></div>

                        <div class="robot-face">

                            <div class="eye left-eye"></div>
                            <div class="eye right-eye"></div>

                            <div class="robot-smile"></div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Heading -->
            <!-- NOTE: text content is now set/replaced by JS (applyLang) so it can swap
                 language. The span.brand-name below is the default EN render; JS
                 overwrites this h1's innerHTML on load and on toggle. -->
            <h1 id="raiHeading">
                How can <span class="brand-name">RAI</span> help?
            </h1>


            <!-- Search / Ask RAI -->
            <div class="ask-box">

                <div class="ask-icon">
                    ✦
                </div>

                <input
                    type="text"
                    id="raiInput"
                    placeholder="Ask RAI..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    class="send-button"
                    aria-label="Send"
                >
                    ➤
                </button>

            </div>


            <!-- Quick Reply Buttons -->
            <!-- NOTE: data-key added so JS can swap each button's visible label AND
                 its data-message (the text actually sent to RAI) together. -->
            <div class="quick-actions">

                <button
                    class="quick-button"
                    data-key="billing"
                    data-message="I need help with billing and payments."
                >
                    <div class="quick-icon">
                        $
                    </div>

                    <span>
                        Billing & Payments
                    </span>
                </button>


                <button
                    class="quick-button"
                    data-key="maintenance"
                    data-message="I need help with a maintenance request."
                >
                    <div class="quick-icon wrench">
                        🔧
                    </div>

                    <span>
                        Maintenance Requests
                    </span>
                </button>


                <button
                    class="quick-button"
                    data-key="projectStatus"
                    data-message="I would like to check my project status."
                >
                    <div class="quick-icon">
                        ✓
                    </div>

                    <span>
                        Project Status
                    </span>
                </button>


                <button
                    class="quick-button"
                    data-key="cancellations"
                    data-message="I need help with cancelling or changing my project."
                >
                    <div class="quick-icon">
                        ×
                    </div>

                    <span>
                        Cancellations & Changes
                    </span>
                </button>

            </div>


            <!-- Loading / Status -->
            <div id="raiStatus" class="rai-status">
                Connecting to RAI...
            </div>


            <!-- =========================
                 CHAT STAGE  (NEW)
                 The real Salesforce conversation window mounts INSIDE this
                 div once launchChat() runs, via displayMode = 'inline' +
                 targetElement below. It stays empty/hidden until then.
            ========================== -->

            <div id="rai-chat-container" class="rai-chat-container">

                <p id="rai-chat-placeholder" class="rai-chat-placeholder">
                    Your conversation will open here.
                </p>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER IMAGE
    ========================== -->

    <footer class="site-footer">

        <img
            src="footer.png"
            alt="LGCY Footer"
            class="footer-image"
        >

    </footer>


    <!-- =========================
         SALESFORCE EMBEDDED MESSAGING
    ========================== -->

    <script type="text/javascript">

        function initEmbeddedMessaging() {

            console.log(
                "[RAI] Initializing Embedded Messaging..."
            );

            try {

                // NOTE: this is read once, at init time. Toggling EN/ES on the page
                // AFTER this has run does not change the bot's own language — see
                // the note in script.js above the language toggle code.
                embeddedservice_bootstrap.settings.language = 'en_US';

                embeddedservice_bootstrap.settings.hideChatButton = true;

                // NEW: mount the real conversation window inside our centered
                // #rai-chat-container div instead of a floating corner bubble.
                // Requires Enhanced Web Chat v2 (ECv2). If your deployment is
                // legacy v1, this pair of settings is ignored and you'll still
                // see the default floating behavior — let me know and I'll swap
                // in the CSS-override fallback instead.
                embeddedservice_bootstrap.settings.displayMode = 'inline';

                embeddedservice_bootstrap.settings.targetElement =
                    document.getElementById('rai-chat-container');

                // Keep the container empty/placeholder until the user actually
                // triggers a conversation (Ask RAI / a quick action), rather
                // than auto-starting a blank chat the instant the page loads.
                embeddedservice_bootstrap.settings.disableInlineAutoLaunch = true;

                embeddedservice_bootstrap.init(

                    '00Dak00001CA8mT',

                    'RAI_Messaging_Service',

                    'https://orgfarm-bab6d235b5-dev-ed.develop.my.site.com/ESWRAIMessagingService1788353264936',

                    {
                        scrt2URL:
                            'https://orgfarm-bab6d235b5-dev-ed.develop.my.salesforce-scrt.com'
                    }

                );

            }

            catch (err) {

                console.error(
                    '[RAI] Error loading Embedded Messaging:',
                    err
                );

                updateRAIStatus(
                    "Unable to connect to RAI."
                );

            }

        }


        window.addEventListener(
            "onEmbeddedMessagingReady",
            function () {

                console.log(
                    "[RAI] Embedded Messaging is ready."
                );

                updateRAIStatus(
                    currentLang === "es"
                        ? "RAI está listo para ayudar."
                        : "RAI is ready to help."
                );

            }
        );


        (function () {

            const script =
                document.createElement('script');

            script.src =
                'https://orgfarm-bab6d235b5-dev-ed.develop.my.site.com/ESWRAIMessagingService1788353264936/assets/js/bootstrap.min.js';

            script.async = true;


            script.onload = function () {

                console.log(
                    "[RAI] Salesforce bootstrap loaded."
                );

                initEmbeddedMessaging();

            };


            script.onerror = function () {

                console.error(
                    "[RAI] Salesforce bootstrap failed."
                );

                updateRAIStatus(
                    "Unable to connect to RAI."
                );

            };


            document.head.appendChild(script);

        })();

    </script>


    <!-- Your RAI JavaScript -->
    <script src="script.js"></script>

</body>

</html>
