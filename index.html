<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAI - Customer Support</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER IMAGE
    ========================== -->

    <header class="site-header">

        <img
            src="header.png"
            alt="LGCY Header"
            class="header-image"
        >

    </header>


    <!-- =========================
         LANGUAGE TOGGLE
    ========================== -->

    <div class="lang-toggle" role="group" aria-label="Language / Idioma">

        <button
            type="button"
            id="lang-en"
            class="lang-btn"
            aria-pressed="true"
        >
            EN
        </button>

        <button
            type="button"
            id="lang-es"
            class="lang-btn"
            aria-pressed="false"
        >
            ES
        </button>

    </div>


    <!-- =========================
         RAI MAIN PAGE
    ========================== -->

    <main class="rai-page">

        <div class="rai-container">

            <!-- RAI Robot -->
            <div class="rai-logo">

                <div class="spark spark-1">✦</div>
                <div class="spark spark-2">✦</div>
                <div class="spark spark-3">✦</div>

                <div class="robot-circle">

                    <div class="robot">

                        <div class="robot-ear left"></div>
                        <div class="robot-ear right"></div>

                        <div class="robot-face">

                            <div class="eye left-eye"></div>
                            <div class="eye right-eye"></div>

                            <div class="robot-smile"></div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Heading -->
            <h1 id="raiHeading">
                How can <span class="brand-name">RAI</span> help?
            </h1>


            <!-- Search / Ask RAI -->
            <div class="ask-box">

                <div class="ask-icon">
                    ✦
                </div>

                <input
                    type="text"
                    id="raiInput"
                    placeholder="Ask RAI..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    class="send-button"
                    aria-label="Send"
                >
                    ➤
                </button>

            </div>


            <!-- Quick Reply Buttons -->
            <div class="quick-actions">

                <button
                    class="quick-button"
                    data-key="billing"
                    data-message="I need help with billing and payments."
                >
                    <div class="quick-icon">
                        $
                    </div>

                    <span>
                         Flight Cancellation
                    </span>
                </button>


                <button
                    class="quick-button"
                    data-key="maintenance"
                    data-message="I need help with a maintenance request."
                >
                    <div class="quick-icon wrench">
                        🔧
                    </div>

                    <span>
                        Baggage Allowance
                    </span>
                </button>


                <button
                    class="quick-button"
                    data-key="projectStatus"
                    data-message="I would like to check my project status."
                >
                    <div class="quick-icon">
                        ✓
                    </div>

                    <span>
                        Hotel Cancellation
                    </span>
                </button>


                <button
                    class="quick-button"
                    data-key="cancellations"
                    data-message="I need help with cancelling or changing my project."
                >
                    <div class="quick-icon">
                        ×
                    </div>

                    <span>
                        Travel Insurance
                    </span>
                </button>

            </div>


            <!-- Loading / Status -->
            <div id="raiStatus" class="rai-status">
                Connecting to RAI...
            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER IMAGE
    ========================== -->

    <footer class="site-footer">

        <img
            src="footer.png"
            alt="LGCY Footer"
            class="footer-image"
        >

    </footer>


    <!-- =========================
         FLOATING LAUNCHER  (NEW)
         Round bubble, fixed bottom-right. Hidden until the chat has been
         opened at least once; reappears whenever the chat is minimized.
    ========================== -->

    <button
        id="rai-launcher"
        class="rai-launcher"
        type="button"
        aria-label="Open RAI chat"
    >
        <svg
            class="rai-launcher-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >
            <path
                d="M4 12c0-4.4183 3.5817-8 8-8s8 3.5817 8 8c0 4.4183-3.5817 8-8 8-1.2 0-2.34-.27-3.36-.75L4 20l1.11-4.32C4.4 14.68 4 13.38 4 12Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>

        <span id="rai-launcher-text" class="rai-launcher-text">Ask Me Anything</span>
    </button>


    <!-- =========================
         FULLSCREEN CHAT OVERLAY  (NEW)
         True fullscreen (position: fixed; inset: 0) instead of the old
         centered 480x600 box. Hidden by default via CSS; toggled open
         with the .is-open class. The Salesforce conversation window
         mounts into #rai-chat-body only, so our own header (with the
         minimize control) never gets touched by Salesforce's render.
    ========================== -->

    <div id="rai-chat-container" class="rai-chat-container">

        <div class="rai-chat-header">

            <span class="rai-chat-header-title">RAI Assistant</span>

            <button
                id="rai-minimize-btn"
                class="rai-chat-header-btn"
                type="button"
                aria-label="Minimize chat"
                title="Minimize"
            >
                &#8211;
            </button>

        </div>

        <div id="rai-chat-body" class="rai-chat-body">

            <p id="rai-chat-placeholder" class="rai-chat-placeholder">
                Your conversation will open here.
            </p>

        </div>

    </div>


    <!-- =========================
         SALESFORCE EMBEDDED MESSAGING
    ========================== -->

    <script type="text/javascript">

        function initEmbeddedMessaging() {

            console.log(
                "[RAI] Initializing Embedded Messaging..."
            );

            try {

                embeddedservice_bootstrap.settings.language = 'en_US';

                embeddedservice_bootstrap.settings.hideChatButton = true;

                // Mount the real conversation window inside the INNER body div,
                // not the outer overlay — so our header/minimize button and the
                // launcher bubble stay under our own control at all times.
                embeddedservice_bootstrap.settings.displayMode = 'inline';

                embeddedservice_bootstrap.settings.targetElement =
                    document.getElementById('rai-chat-body');

                // Keep it empty until the user actually triggers a conversation.
                embeddedservice_bootstrap.settings.disableInlineAutoLaunch = true;

                embeddedservice_bootstrap.init(

                    '00Dak00001CA8mT',

                    'RAI_Messaging_Service',

                    'https://orgfarm-bab6d235b5-dev-ed.develop.my.site.com/ESWRAIMessagingService1788353264936',

                    {
                        scrt2URL:
                            'https://orgfarm-bab6d235b5-dev-ed.develop.my.salesforce-scrt.com'
                    }

                );

            }

            catch (err) {

                console.error(
                    '[RAI] Error loading Embedded Messaging:',
                    err
                );

                updateRAIStatus(
                    "Unable to connect to RAI."
                );

            }

        }


        window.addEventListener(
            "onEmbeddedMessagingReady",
            function () {

                console.log(
                    "[RAI] Embedded Messaging is ready."
                );

                updateRAIStatus(
                    currentLang === "es"
                        ? "RAI está listo para ayudar."
                        : "RAI is ready to help."
                );

            }
        );


        (function () {

            const script =
                document.createElement('script');

            script.src =
                'https://orgfarm-bab6d235b5-dev-ed.develop.my.site.com/ESWRAIMessagingService1788353264936/assets/js/bootstrap.min.js';

            script.async = true;


            script.onload = function () {

                console.log(
                    "[RAI] Salesforce bootstrap loaded."
                );

                initEmbeddedMessaging();

            };


            script.onerror = function () {

                console.error(
                    "[RAI] Salesforce bootstrap failed."
                );

                updateRAIStatus(
                    "Unable to connect to RAI."
                );

            };


            document.head.appendChild(script);

        })();

    </script>


    <!-- Your RAI JavaScript -->
    <script src="script.js"></script>

</body>

</html>
